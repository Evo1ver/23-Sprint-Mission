<!DOCTYPE html>
<html lang="kr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.6/dist/web/static/pretendard.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="wrap">
      <a class="logo-btn" href="/"><img src="./images/logo.svg" alt="판다마켓 로고"></a>
      <a class="login-btn" href="login.html">로그인</a>
    </div>
  </header>
  <main>
    <section id="section01" class="section-blue">
      <div class="wrap">
        <div class="box">
          <div class="box-txt">
            <h1>
              일상의 모든 물건을<br>
              거래해 보세요
            </h1>
            <a href="items.html">구경하러 가기</a>
          </div>
          <div class="box-img">
            <img src="./images/section01-img.png" alt="section01 이미지">
          </div>
        </div>
      </div>
    </section>
    <section id="section02" class="section-white">
      <div class="wrap">
        <div class="box">
          <div class="box-img">
            <img src="./images/section02-img.png" alt="section02 이미지">
          </div>
          <div class="box-txt">
            <h2>Hot item</h2>
            <h1>
              인기 상품을<br>
              확인해 보세요
            </h1>
            <p>
              가장 HOT한 중고거래 물품을<br>
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </div>
    </section>
    <section id="section03" class="section-white">
      <div class="wrap">
        <div class="box">
          <div class="box-img">
            <img src="./images/section03-img.png" alt="section03 이미지">
          </div>
          <div class="box-txt">
            <h2>Search</h2>
            <h1>
              구매를 원하는<br>
              상품을 검색하세요
            </h1>
            <p>
              구매하고 싶은 물품은 검색해서<br>
              쉽게 찾아보세요
          </div>
        </div>
      </div>
    </section>
    <section id="section04" class="section-white">
      <div class="wrap">
        <div class="box">
          <div class="box-img">
            <img src="./images/section04-img.png" alt="section04 이미지">
          </div>
          <div class="box-txt">
            <h2>Register</h2>
            <h1>
              판매를 원하는<br>
              상품을 등록하세요
            </h1>
            <p>
              어떤 물건이든 판매하고 싶은 상품을<br>
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </div>
    </section>
    <section id="section05" class="section-blue">
      <div class="wrap">
        <div class="box">
          <div class="box-txt">
            <h1>
              믿을 수 있는<br>
              판다마켓 중고 거래
            </h1>
          </div>
          <div class="box-img">
            <img src="./images/section05-img.png" alt="section05 이미지">
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer></footer>
</body>
</html>
